<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="clock">
    <div class="clock-time"></div>
    <div class="clock-date"></div>
  </div>

  <!-- CONTAINER -->
  <div class="calendar">

    <!-- HEADER -->
    <div class="calendar-header">

      <!-- Tombol Previous -->
      <button class="prev-btn">
        &#10094;
      </button>

      <div class="month-year-wrapper">
        <!-- Bulan dan Tahun -->
        <h1 class="month-year" title="Klik untuk pilih bulan dan tahun"></h1>

        <div class="month-year-picker">
          <select class="month-select"></select>
          <select class="year-select"></select>
        </div>
      </div>

      <!-- Tombol Next -->
      <button class="next-btn">
        &#10095;
      </button>

    </div>

    <!-- NAMA HARI -->
    <div class="days-name">
      <div>Minggu</div>
      <div>Senin</div>
      <div>Selasa</div>
      <div>Rabu</div>
      <div>Kamis</div>
      <div>Jumat</div>
      <div>Sabtu</div>
    </div>

    <!-- TANGGAL -->
    <div class="days">
      <!-- Hari aktif -->
      <div class="day active">30</div>

    </div>

  </div>
  
  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
