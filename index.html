<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTAINER -->
  <div class="calendar">

    <!-- HEADER -->
    <div class="calendar-header">

      <!-- Tombol Previous -->
      <button class="prev-btn">
        &#10094;
      </button>

      <!-- Bulan dan Tahun -->
      <h1 class="month-year">
        April 2026
      </h1>

      <!-- Tombol Next -->
      <button class="next-btn">
        &#10095;
      </button>

    </div>

    <!-- NAMA HARI -->
    <div class="days-name">
      <div>Minggu</div>
      <div>Senin</div>
      <div>Selasa</div>
      <div>Rabu</div>
      <div>Kamis</div>
      <div>Jumat</div>
      <div>Sabtu</div>
    </div>

    <!-- TANGGAL -->
    <div class="days">

      <!-- Contoh tanggal -->
      <div class="day">1</div>
      <div class="day">2</div>
      <div class="day">3</div>
      <div class="day">4</div>
      <div class="day">5</div>

      <!-- Hari aktif -->
      <div class="day active">30</div>

    </div>

  </div>
  
  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
